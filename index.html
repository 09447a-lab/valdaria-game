<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صعود الفهد — ملف سري | Valdaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="landing">
  <div class="landing-bg"></div>
  <div class="landing-content">
    <div class="stamp-corner">سرّي<br><span>TOP SECRET</span></div>
    <h1 class="game-title">صُعُودُ الفَهد</h1>
    <h2 class="game-subtitle">ملفٌ سرّيٌّ من جمهورية فالداريا</h2>
    <p class="game-tagline">لعبة استراتيجية سياسية-عسكرية</p>
    <p class="game-desc">أنت طالب جامعي عادي، في بلد يحكمها طاغية منذ ثمانية عشر عاماً. مظاهرة جامعية واحدة ستقلب حياتك. هل ستتحول من متفرج إلى حاكم؟ أم ستموت في الطريق؟</p>
    <div class="landing-buttons">
      <button class="btn btn-primary" id="btn-new">▶ ابدأ لعبة جديدة</button>
      <button class="btn btn-secondary" id="btn-load" disabled>📂 تحميل لعبة محفوظة</button>
      <button class="btn btn-tertiary" id="btn-archive">📜 الملف السري (الأرشيف)</button>
    </div>
    <div class="settings-card">
      <h3>الإعدادات</h3>
      <label>مستوى الصعوبة:
        <select id="difficulty">
          <option value="easy">سهل</option>
          <option value="medium" selected>متوسط</option>
          <option value="hard">صعب</option>
        </select>
      </label>
      <label>اسم اللاعب:
        <input type="text" id="player-name" value="أليكس" maxlength="20">
      </label>
    </div>
    <div class="landing-footer">نسخة تجريبية 0.1 — MVP</div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/landing.js"></script>
</body>
</html>
